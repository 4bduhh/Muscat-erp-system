    :root{--bg:#0b1020;--tx:#e8ecf8;--mu:#8b95b3;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--ac:#6d8dbf;--ac2:#9bb7de;--ok:#2fd38a;--wa:#ffb84d;--er:#ff6b7a;--sh:0 10px 30px rgba(0,0,0,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}

    *{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;width:50vw;height:50vw;border-radius:50%;filter:blur(110px);opacity:.35;z-index:0;pointer-events:none}body:before{background:var(--ac);top:-15vw;left:10vw}body:after{background:var(--ac2);bottom:-20vw;right:0}
    button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
    .glass{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;box-shadow:var(--sh)}
    #app{display:flex;position:relative;z-index:1;min-height:100%}
    aside{width:236px;padding:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
    .brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px;font-weight:800;font-size:17px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px #1e1e2d66}
    .nav{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--mu);text-align:left;transition:.2s}.nav:hover{background:var(--gl);color:var(--tx);transform:translateX(2px)}.nav.on{background:linear-gradient(90deg,#1e1e2d33,#1e1e2d1a);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
    main{flex:1;min-width:0;padding:16px 22px 90px}
    .top{display:flex;gap:10px;align-items:center;padding:10px 14px;position:sticky;top:10px;z-index:5;margin-bottom:20px}.top h1{font-size:16px;margin:0;flex:1}.crumb{font-size:11px;color:var(--mu);display:block;font-weight:400}
    .in,select.in{background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;box-shadow:inset 2px 2px 5px #0002,inset -2px -2px 5px #ffffff0a;outline:0}.sr{max-width:230px}
    .btn{border:1px solid var(--bd);background:var(--gl);border-radius:12px;padding:10px 14px;font-weight:600;transition:.15s;min-height:40px}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;box-shadow:0 8px 20px #1e1e2d55}.btn.s{padding:6px 10px;min-height:0;font-size:12px}.btn.d{color:var(--er)}
    .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}.kpi{padding:16px;transition:.2s;animation:up .4s both}.kpi:hover{transform:translateY(-3px)}.kpi small{color:var(--mu);font-size:12px}.kpi b{display:block;font-size:24px;margin:6px 0 2px}.kpi i{font-style:normal;font-size:11px}
    .c2{display:grid;gap:14px;grid-template-columns:1.6fr 1fr;margin-bottom:16px}.pn{padding:18px;margin-bottom:16px}.pn h3{margin:0 0 12px;font-size:15px}.hd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.hd h2{margin:0;font-size:22px}.hd p{margin:2px 0 0;color:var(--mu);font-size:12px}
    table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;padding:10px}td{padding:12px 10px;border-top:1px solid var(--bd)}tbody tr{transition:.15s}tbody tr:hover{background:var(--gl)}.tw{overflow-x:auto}
    .bd{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700}.ok{background:#2fd38a22;color:var(--ok)}.wa{background:#ffb84d22;color:var(--wa)}.er{background:#ff6b7a22;color:var(--er)}
    .av{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;margin-right:9px;vertical-align:middle}
    .mb{position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:14px;animation:fi .2s}.md{width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;background:var(--bg);animation:up .25s}.md label{display:block;font-size:12px;color:var(--mu);margin-bottom:12px}.md label .in{margin-top:5px;color:var(--tx)}.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
    #toast{position:fixed;right:18px;top:18px;z-index:99;display:grid;gap:8px}.t{padding:12px 16px;border-radius:12px;animation:up .25s;border-left:4px solid var(--ok)}.t.e{border-color:var(--er)}
    .slip{background:#fff;color:#172033;padding:20px;border-radius:12px}.slip table td{border-color:#e5e8f0;padding:8px 4px}.mu{color:var(--mu)}.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
    .bt{display:none}.sk{height:80px;border-radius:14px;background:linear-gradient(90deg,var(--gl),var(--bd),var(--gl));background-size:200% 100%;animation:sh 1.2s infinite}
    @keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes fi{from{opacity:0}}@keyframes sh{to{background-position:-200% 0}}
    @media(max-width:900px){aside{display:none}.c2{grid-template-columns:1fr}main{padding:10px 12px 90px}.sr{max-width:none}

    const zTS=()=>ZSYNC==null?'<span class="bd wa">Syncing time…</span>':ZSYNC.ok?(Math.abs(ZSYNC.drift)>12e4?`<span class="bd wa">Phone clock off by ${Math.round(Math.abs(ZSYNC.drift)/6e4)} min · server time used</span>`:'<span class="bd ok">✔ Time verified online</span>'):'<span class="bd er">Time not verified (offline)</span>';
    async function zSync(){const a=ZN();let srv=null;const tryF=async(u,f)=>{let t;try{const c=new AbortController();t=setTimeout(()=>c.abort(),6000);const j=await(await fetch(u,{cache:'no-store',signal:c.signal})).json();return f(j)}catch(e){return null}finally{clearTimeout(t)}};
    srv=await tryF('https://worldtimeapi.org/api/timezone/Asia/Muscat',j=>j.unixtime?j.unixtime*1000:null);
    if(!srv)srv=await tryF('https://timeapi.io/api/Time/current/zone?timeZone=Asia/Muscat',j=>j.dateTime?Date.parse(j.dateTime.replace(/(\.\d{3})\d*/,'$1')+'+04:00'):null);
    const b=ZN();if(srv){const mid=(a+b)/2;ZSYNC={ok:true,drift:mid-srv,at:b};ZOFF=srv+(b-a)/2-b}else if(!ZSYNC||!ZSYNC.ok)ZSYNC={ok:false,drift:0,at:b};
    const el=$('#tsync');el&&(el.innerHTML=zTS())}

    /* ===== v6: Muscat time · auto attendance→payroll · Insights & forecasting ===== */
    const zDate=ms=>new Date(ms).toLocaleDateString('en-CA',{timeZone:'Asia/Muscat'}),
    zAdd=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)},
    zDow=d=>new Date(d+'T00:00:00Z').getUTCDay(),
    zAt=(d,t)=>new Date(d+'T'+t+':00+04:00').getTime(),

    zClock=()=>'🕐 Muscat '+new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · GMT+4',
    WKD={FS:[5,6],F:[5],SaSu:[6,0],Su:[0]},

    /* One day of one employee, evaluated in Muscat time */
    function zDay(e,u,d,recs){const c=S.cfg,today=td(),rec=recs.find(r=>r.d==d),off=zOff(d)||d<zStart(e),lv=zLeave(e,u,d),o={d,off,rec,lv,late:0,short:0,ot:0,abs:false,pend:false,w:0};
    if(rec){o.w=worked(rec);o.pend=!rec.out&&rec.d==today;const lt=Math.max(0,rec.in-zAt(d,c.st)),g=c.gr*6e4;o.late=lt>g?lt:0;
    if(!o.pend){if(off)o.ot=o.w;else{o.short=Math.max(0,zReq()-o.w-(lt<=g?lt:0));o.ot=Math.max(0,o.w-zReq())}}
    o.short=o.short<6e4?0:Math.floor(o.short/6e4)*6e4}
    else if(!off&&!lv&&(d<today||(d==today&&Date.now()>zAt(d,c.en))))o.abs=true;
    return o}

    /* Payroll for the current Muscat month, calculated automatically from attendance */
    function zPay(e,ym=zYM()){const u=zUser(e),g=r3(e.basic+e.inc),fx=e.ded||0;
    if(!u){const pl=S.leaves.filter(l=>l.e==e.id&&l.st=='Approved'&&l.type!='Unpaid').reduce((a,l)=>a+l.d,0),ab=Math.max(0,26-e.att-pl),unpAmt=r3(g/26*unpaid(e.id)),absAmt=r3(g/26*ab),d=r3(unpAmt+absAmt+fx);
    return{g,ot:0,otAmt:0,otMin:0,d,n:r3(g-d),src:'manual',wd:26,present:e.att,absent:ab,paidL:pl,unpL:unpaid(e.id),lateD:0,shortMin:0,absAmt,unpAmt,shAmt:0,fx}}
    const c=S.cfg,today=td(),days=zMD(ym),recs=S.att.filter(r=>r.k==u.email),wd=days.filter(d=>!zOff(d)).length||1,rate=g/wd,hr=rate/(zReq()/36e5),
    R={g,wd,present:0,absent:0,paidL:0,unpL:0,lateD:0,shortMin:0,otMin:0,src:'auto',fx};
    days.filter(d=>d<=today).forEach(d=>{const o=zDay(e,u,d,recs);if(o.rec)R.present++;if(o.abs)R.absent++;if(o.lv&&!o.off&&!o.rec)o.lv.type=='Unpaid'?R.unpL++:R.paidL++;if(o.late)R.lateD++;R.shortMin+=o.short/6e4;const om=Math.floor(o.ot/6e4);if(om>=15)R.otMin+=om});
    R.pre=e.jd?days.filter(d=>!zOff(d)&&d<e.jd).length:0;R.preAmt=r3(R.pre*rate);R.absAmt=r3(R.absent*rate);R.unpAmt=r3(R.unpL*rate);R.shAmt=r3(R.shortMin/60*hr);R.otAmt=c.om>0?r3(R.otMin/60*hr*c.om):0;R.ot=R.otAmt;
    R.d=r3(R.absAmt+R.unpAmt+R.shAmt+R.preAmt+fx);R.n=r3(Math.max(0,g+R.otAmt-R.d));return R}

    /* ---------- Forecasting helpers ---------- */
    function zLR(y){const n=y.length,mx=(n-1)/2,my=y.reduce((a,b)=>a+b,0)/(n||1);let nu=0,de=0;y.forEach((v,i)=>{nu+=(i-mx)*(v-my);de+=(i-mx)**2});return de?nu/de:0}
    function zFc(){const today=td(),by={};S.sales.forEach(s=>{const d=zDate(s.dt);by[d]=(by[d]||0)+s.t});const ds=Object.keys(by).sort();if(!ds.length)return null;
    const first=ds[0],span=Math.round((new Date(today)-new Date(first))/864e5)+1,N=Math.min(28,span),y=[];for(let i=N-1;i>=0;i--)y.push(by[zAdd(today,-i)]||0);
    const b=zLR(y),k=Math.min(14,span),base=y.slice(-k).reduce((a,v)=>a+v,0)/k;let idx=[1,1,1,1,1,1,1];
    if(span>=28){const s=Array(7).fill(0),c=Array(7).fill(0);for(let i=0;i<Math.min(span,84);i++){const d=zAdd(today,-i);s[zDow(d)]+=by[d]||0;c[zDow(d)]++}const tc=c.reduce((a,v)=>a+v,0),av2=s.reduce((a,v)=>a+v,0)/tc;if(av2>0)idx=s.map((v,i)=>c[i]?(v/c[i])/av2:1)}
    const fn=d=>{const h=Math.round((new Date(d)-new Date(today))/864e5),tr=Math.max(-.3*base,Math.min(.3*base,b*Math.min(h,14)*.5));return Math.max(0,(base+tr)*idx[zDow(d)])};
    return{fn,by,span,base,conf:span<14?'Low':span<60?'Medium':'High'}}
    function zProd(){const today=td(),c30=zAdd(today,-29),c14=zAdd(today,-13),p14=zAdd(today,-27),m={};S.inv.forEach(p=>m[p.sku]={p,q30:0,v30:0,r14:0,pv:0,first:null});
    S.sales.forEach(s=>{const d=zDate(s.dt);(s.items||[]).forEach(i=>{const x=m[i.sku];if(!x)return;const v=i.q*i.pr;if(!x.first||d<x.first)x.first=d;if(d>=c30){x.q30+=i.q;x.v30+=v}if(d>=c14)x.r14+=v;else if(d>=p14)x.pv+=v})});
    return Object.values(m).map(x=>{const span=x.first?Math.min(30,Math.max(7,Math.round((new Date(today)-new Date(x.first))/864e5)+1)):30,vel=x.q30/span,st=stock(x.p);return{...x,vel,st,left:vel>0?st/vel:Infinity,gr:x.pv>0?(x.r14-x.pv)/x.pv:(x.r14>0?1:0),re:Math.max(0,Math.ceil(vel*14+x.p.min-st))}})}
    function zEmp(){const today=td(),from=zAdd(today,-29),days=[];for(let d=from;d<=today;d=zAdd(d,1))days.push(d);const rq=zReq()/6e4;
    return S.emps.map(e=>{const u=zUser(e);if(!u)return{e,none:1};const recs=S.att.filter(r=>r.k==u.email),wds=days.filter(d=>!zOff(d));let wk=0,pr=0,ab=0,lt=0,sm=0,ot=0,wl=0,wn=0,wa=0;
    wds.forEach((d,ix)=>{const o=zDay(e,u,d,recs),w=ix>=wds.length-10?2:1;if(o.pend||(o.lv&&!o.rec)||(!o.rec&&!o.abs))return;wk++;wn+=w;if(o.rec){pr++;if(o.late){lt++;wl+=w}sm+=o.short/6e4;ot+=Math.floor(o.ot/6e4)}else{ab++;wa+=w}});
    const att=wk?pr/wk:null,punc=pr?1-lt/pr:null,comp=pr?Math.max(0,1-sm/(pr*rq)):null,score=wk>=3?Math.round(100*(.5*att+.35*punc+.15*comp)):null,risk=wn?Math.max(wl/Math.max(1,wn-wa),1.5*wa/wn):0;
    return{e,wk,pr,ab,lt,sm,ot,att,punc,score,risk,lvl:risk<.15?'Low':risk<.35?'Medium':'High'}})}
    function zChart(act,fc,lb){const W=640,H=170,n=act.length+fc.length,mx=Math.max(1,...act,...fc),bw=W/n,tx=(x,t,a)=>`<text x="${x}" y="${H+16}" font-size="11" text-anchor="${a}" fill="currentColor" opacity=".6">${t}</text>`;
    let s=`<svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img" aria-label="Sales for the last ${act.length} days and a ${fc.length} day forecast">`;
    [...act.map((v,i)=>[v,i,0]),...fc.map((v,i)=>[v,i+act.length,1])].forEach(([v,i,f])=>{const h=Math.round(v/mx*H);s+=`<rect x="${(i*bw+1.5).toFixed(1)}" y="${H-h}" width="${(bw-3).toFixed(1)}" height="${h}" rx="3" fill="${f?'#f59e0b':'#6d8dbf'}" opacity="${f?.6:.9}"><title>${lb[i]}: ${M(v)}${f?' (forecast)':''}</title></rect>`});
    return s+`<line x1="${act.length*bw}" x2="${act.length*bw}" y1="0" y2="${H}" stroke="currentColor" stroke-dasharray="4 4" opacity=".35"/>`+tx(2,lb[0],'start')+tx(act.length*bw,'Today','middle')+tx(W-2,lb[n-1],'end')+'</svg>'}
